<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a12" />
    <title>Scientific Animation Generator · Offline</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 20%,#173c61,#050a12 58%);color:#edf6ff;text-align:center}
      main{max-width:460px;padding:28px;border:1px solid #ffffff24;border-radius:20px;background:#091321e8;box-shadow:0 24px 80px #0008}h1{margin:0 0 12px;font-size:22px}p{margin:0 0 20px;color:#a9bdd2;line-height:1.6}button{min-height:44px;padding:0 18px;border:1px solid #56c8ff66;border-radius:10px;background:#2d9cff;color:#00111d;font-weight:700;font:inherit}
    </style>
  </head>
  <body>
    <main>
      <h1>Offline editor unavailable</h1>
      <p>This device has not cached the complete editor yet. Reconnect once, open the app, and allow the first load to finish. Future sessions can then run offline.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
