<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Science Animator" />
    <meta name="description" content="Offline scientific animation generator for interactive solar-system web components." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <title>Scientific Animation Generator</title>
    <style>
      #boot-status{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#050a12;color:#edf6ff;font-family:system-ui,-apple-system,sans-serif;text-align:center}
      #boot-status div{max-width:420px;padding:24px;border:1px solid #ffffff20;border-radius:18px;background:#091321}
      #boot-status p{color:#9db1c8;line-height:1.5}#boot-status button{min-height:44px;padding:0 16px;border:1px solid #56c8ff66;border-radius:10px;background:#2d9cff;color:#00111d;font-weight:700}
    </style>
  </head>
  <body>
    <div id="app">
      <main id="boot-status" role="status" aria-live="polite">
        <div>
          <strong>Scientific Animation Generator</strong>
          <p id="boot-message">Loading the offline editor…</p>
          <button id="boot-retry" type="button" hidden onclick="location.reload()">Retry</button>
        </div>
      </main>
    </div>
    <script>
      addEventListener('offline',()=>{const m=document.getElementById('boot-message'),b=document.getElementById('boot-retry');if(m)m.textContent='You are offline. Open the app once online to prepare its offline cache, then it can run without a connection.';if(b)b.hidden=false});
      setTimeout(()=>{const s=document.getElementById('boot-status');if(!s)return;const m=document.getElementById('boot-message'),b=document.getElementById('boot-retry');if(m)m.textContent=navigator.onLine?'The editor is taking longer than expected. Retry the app.':'Offline cache is not ready on this device yet. Connect once, reopen the app, and wait for “Offline ready”.';if(b)b.hidden=false},8000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
